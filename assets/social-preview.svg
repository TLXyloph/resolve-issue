<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">resolve-issue</title>
  <desc id="desc">resolve-issue, a Claude Code plugin. GitHub issue in. Validated pull request out. Published only when you say so. Install with /plugin install resolve-issue --marketplace TLXyloph/resolve-issue</desc>
  <defs>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="124" y1="0" x2="1046" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <ellipse cx="1180" cy="60" rx="520" ry="340" fill="url(#glowB)"/>
  <ellipse cx="60" cy="620" rx="520" ry="300" fill="url(#glowA)"/>
  <rect x="76" y="64" width="218" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
  <text x="185" y="84" text-anchor="middle" class="mono" font-size="17" fill="#c9d1d9">Claude Code plugin</text>

  <text x="72" y="206" class="sans" font-size="104" font-weight="800" letter-spacing="-2" fill="#f0f6fc">resolve-issue</text>
  <text x="76" y="266" class="sans" font-size="34" fill="#c9d1d9">GitHub issue in. Validated pull request out.</text>
  <text x="76" y="312" class="sans" font-size="34" font-weight="700" fill="url(#accent)">Published only when you say so.</text>
  <line x1="124" y1="400" x2="846" y2="400" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
