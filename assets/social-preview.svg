<path d="M224 400.5 l4 4.5 l8.5 -9" fill="none" stroke="url(#rail)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="230" y="450" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">viable</text>
