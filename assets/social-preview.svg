<rect x="846" y="372" width="200" height="56" rx="28" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="2"/>
<circle cx="876" cy="400" r="13" fill="#a78bfa"/>
<path d="M870 400.5 l4 4 l8 -8.5" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="898" y="406.5" class="sans" font-size="19" font-weight="600" fill="#f0f6fc">you approve</text>
<text x="946" y="450" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">checkpoint</text>
<line x1="1050" y1="400" x2="1146" y2="400" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
<g fill="none" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1168" cy="383" r="6"/>
