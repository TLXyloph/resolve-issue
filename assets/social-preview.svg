    <circle cx="1168" cy="417" r="6"/>
    <circle cx="1196" cy="417" r="6"/>
    <path d="M1196 411 V393 a10 10 0 0 0 -10 -10 H1179"/>
    <path d="M1184 378 l-5 5 l5 5"/>
