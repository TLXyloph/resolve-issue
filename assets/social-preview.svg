<circle cx="470" cy="400" r="14" fill="#0d1117" stroke="url(#rail)" stroke-width="2.5"/>
<path d="M464 400.5 l4 4.5 l8.5 -9" fill="none" stroke="url(#rail)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="450" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">fixed</text>
<circle cx="590" cy="400" r="14" fill="#0d1117" stroke="url(#rail)" stroke-width="2.5"/>
<path d="M584 400.5 l4 4.5 l8.5 -9" fill="none" stroke="url(#rail)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="590" y="450" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">re-proven</text>
<circle cx="710" cy="400" r="14" fill="#0d1117" stroke="url(#rail)" stroke-width="2.5"/>
