<text x="1182" y="450" text-anchor="middle" class="mono" font-size="15" fill="#8b949e">pull request</text>

  <rect x="160" y="512" width="960" height="60" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="640" y="550" text-anchor="middle" class="mono" font-size="22" fill="#f0f6fc"><tspan fill="#2dd4bf">/plugin install</tspan> resolve-issue --marketplace TLXyloph/resolve-issue</text>
